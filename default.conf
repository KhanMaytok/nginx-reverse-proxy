map $uri $company_upstream {
    default "";

    ~^/wakamoles/       srv-captain--encomiendas-wakamoles;
    ~^/tavani/          srv-captain--encomiendas-tavani;
    ~^/angeldivinobus/  srv-captain--encomiendas-angeldivinobus;
    ~^/turismombus/     srv-captain--encomiendas-turismombus;
    ~^/ezape/           srv-captain--encomiendas-ezape;
    ~^/chota-express/   srv-captain--encomiendas-chota-express;
    ~^/buschota/        srv-captain--encomiendas-buschota;
    ~^/solchotano/      srv-captain--encomiendas-solchotano;
    ~^/combis/          srv-captain--encomiendas-combis;
    ~^/nsanantonio/     srv-captain--encomiendas-nsanantonio;
    ~^/esantur/         srv-captain--encomiendas-esantur;
    ~^/crucero/         srv-captain--encomiendas-crucero;
    ~^/corazon/         srv-captain--encomiendas-corazon;
    ~^/ilucan/          srv-captain--encomiendas-ilucan;
    ~^/torres/          srv-captain--encomiendas-torres;
}

server {
    listen 80;
    server_name _;
    client_max_body_size $CLIENT_MAX_BODY_SIZE;

    # Docker DNS; la resolucion dinamica permite reiniciar los servicios destino.
    resolver $RESOLVERS valid=10s ipv6=off;

    location ~ "^/[a-z0-9][a-z0-9-]*/invoice/pdf/80mm/(?<invoice_uuid>[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})/?$" {
        if ($company_upstream = "") { return 404; }

        proxy_pass http://$company_upstream/pdf-ticket/80mm/$invoice_uuid$is_args$args;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        return 404;
    }
}
